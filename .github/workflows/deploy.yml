
name: Deploy React Apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Notes App
        working-directory: notes-app
        run: |
          npm ci
          npm run build

      - name: Build Todo App
        working-directory: todo-app
        run: |
          npm ci
          npm run build

      - name: Combine Apps
        run: |
          mkdir -p combined/notes-app combined/todo-app
          cp -r notes-app/dist/. combined/notes-app/
          cp -r todo-app/dist/. combined/todo-app/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
